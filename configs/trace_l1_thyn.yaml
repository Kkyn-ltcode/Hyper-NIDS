name: "thyn_trace"

model:
  model_type: "thyn"
  encoder_type: "mamba"      # "gru" (macOS) | "mamba" (CUDA)
  d_type: 16               # event type embedding dim
  d_model: 64              # input projection dim
  d_hidden: 64             # encoder hidden dim
  n_layers: 2
  dropout: 0.1

data:
  max_seq_len: 512
  stride: 256
  min_seq_len: 2
  label_type: "l1" 
  train_shards: [0, 1, 2, 3, 4]
  val_shards: [5]
  test_shards: [6]

training:
  batch_size: 64
  lr: 0.0005               # lower LR for stability on sparse labels
  weight_decay: 0.0001
  epochs: 20
  patience: 5
  pos_weight: "auto"
  grad_clip: 1.0
  log_every: 100
  # New training improvements
  loss: "bce"            # reverted to bce to ablate focal loss
  focal_gamma: 2.0         
  focal_alpha: 0.25        
  warmup_epochs: 0         # reverted to 0
  accumulation_steps: 1    # reverted to 1 (effective batch = 64)
  temperature_scaling: false 
