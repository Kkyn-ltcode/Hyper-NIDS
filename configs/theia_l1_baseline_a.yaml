name: theia_l1_baseline_a
model:
  model_type: baseline_a
  encoder_type: mamba
  d_type: 16
  d_model: 64
  d_hidden: 64
  n_layers: 2
  dropout: 0.1
data:
  max_seq_len: 512
  stride: 256
  min_seq_len: 2
  label_type: l1
  train_shards:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  val_shards:
  - 7
  test_shards:
  - 8
  - 9
training:
  batch_size: 64
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 30
  patience: 15
  pos_weight: 20.0
  grad_clip: 1.0
  log_every: 100
  accumulation_steps: 8
  warmup_epochs: 5
