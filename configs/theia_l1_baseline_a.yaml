name: "baseline_a_l1"

model:
  model_type: "baseline_a"  # pairwise conv — drops predicateObject2
  encoder_type: "mamba"
  d_type: 16
  d_model: 64
  d_hidden: 64
  n_layers: 2
  dropout: 0.1

data:
  max_seq_len: 512
  stride: 256
  min_seq_len: 2
  label_type: "l1"         # L1** novel-binary labels
  train_shards: [0, 1, 2, 3, 4, 5, 6]
  val_shards: [7]
  test_shards: [8, 9]

training:
  batch_size: 64
  lr: 0.0005               # lower LR for stability on sparse labels
  weight_decay: 0.0001
  epochs: 30               # more epochs for harder task
  patience: 8              # more patience
  pos_weight: "auto"
  grad_clip: 1.0
  log_every: 100
  # New training improvements
  loss: "focal"            # focal loss for extreme imbalance
  focal_gamma: 2.0         # focusing parameter
  focal_alpha: 0.25        # class balance factor
  warmup_epochs: 2         # linear LR warmup
  accumulation_steps: 4    # effective batch = 64*4 = 256
  temperature_scaling: true # post-training calibration
